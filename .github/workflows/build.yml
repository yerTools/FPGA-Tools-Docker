name: Build tools

on:
  push:
    branches: [works-on-my-machine, master]
  pull_request:
    branches: [works-on-my-machine, master]

jobs:
  build-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - name: 🧹 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check out the repository to the runner
        uses: actions/checkout@v5
      - name: 🏷️ Extract Version Information
        id: version
        run: |
          # For tags (releases)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # For main branch
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          # For pull requests
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            PR_NUMBER=$(echo $GITHUB_REF | cut -d / -f 3)
            echo "TAG=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          # For other branches
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            # Replace any characters not allowed in Docker tags with -
            SAFE_BRANCH_NAME=$(echo $BRANCH_NAME | tr '/' '-' | tr '.' '-')
            echo "TAG=branch-${SAFE_BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 💾 Cache Docker Build Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: 🏭 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/yertools/fpga-tools-docker:${{ steps.version.outputs.TAG }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          load: true
      - name: 🧪 Test Tools in Container
        run: |
          docker run --rm ghcr.io/yertools/fpga-tools-docker:${{ steps.version.outputs.TAG }} /bin/bash -c "
            set -e
            echo '=== Testing Icarus Verilog ==='
            iverilog -V
            
            echo '=== Testing Yosys ==='
            yosys -V
            
            echo '=== Testing Verilator ==='
            verilator --version
            
            echo '=== Testing Verible ==='
            verible-verilog-lint --version
            
            echo '=== Testing openFPGALoader ==='
            openFPGALoader --version
            
            echo '=== Testing Python packages ==='
            pip list
            
            echo '=== Testing Gowin IDE ==='
            which gw_ide
            which gw_sh
            
            echo '✅ All tools verified successfully!'
          "
